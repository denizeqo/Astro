<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0d0820;
    color: #dfcff8;
    line-height: 1.7;
    overflow-x: hidden;
}

/* ---------- Background Stars ---------- */

.stars,
.stars::before,
.stars::after {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.stars {
    z-index: 0;

    background-image:
        radial-gradient(
            1px 1px at 10% 20%,
            rgba(255,255,255,.8),
            transparent
        ),
        radial-gradient(
            1px 1px at 30% 70%,
            rgba(255,255,255,.6),
            transparent
        ),
        radial-gradient(
            1px 1px at 50% 30%,
            rgba(255,255,255,.7),
            transparent
        ),
        radial-gradient(
            1px 1px at 70% 80%,
            rgba(255,255,255,.6),
            transparent
        ),
        radial-gradient(
            1px 1px at 90% 40%,
            rgba(255,255,255,.8),
            transparent
        ),
        radial-gradient(
            2px 2px at 20% 90%,
            rgba(255,255,255,.5),
            transparent
        ),
        radial-gradient(
            2px 2px at 80% 15%,
            rgba(255,255,255,.5),
            transparent
        );

    opacity: .7;
}

.stars::before {
    content: "";

    background-image:
        radial-gradient(
            1px 1px at 15% 45%,
            rgba(255,255,255,.6),
            transparent
        ),
        radial-gradient(
            1px 1px at 45% 10%,
            rgba(255,255,255,.7),
            transparent
        ),
        radial-gradient(
            1px 1px at 65% 55%,
            rgba(255,255,255,.6),
            transparent
        ),
        radial-gradient(
            1px 1px at 85% 75%,
            rgba(255,255,255,.7),
            transparent
        );

    animation: starsMove 15s linear infinite;
}

@keyframes starsMove {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-30px);
    }
}


/* ---------- Main Container ---------- */

.page {
    position: relative;
    z-index: 1;
    width: 100%;
}

.container {
    width: min(1100px, 90%);
    margin: 0 auto;
}

.container p{
    color: #dfcff8;
}

/* ---------- Hero ---------- */

.hero {
    min-height: 75vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 100px 20px 80px;

    position: relative;
}

.hero-content {
    max-width: 900px;
}

.eyebrow {
    text-transform: uppercase;

    letter-spacing: 5px;

    font-size: 13px;

    color: #c7b5e8;

    margin-bottom: 20px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 78px);

    line-height: 1.05;

    font-weight: 500;

    letter-spacing: 1px;

    margin-bottom: 30px;
}

.hero h1 span {
    color: #d5c4ff;
}

.hero-intro {
    max-width: 750px;

    margin: auto;

    font-size: clamp(17px, 2vw, 21px);

    color: #e1dced;
}

.hero-line {
    width: 80px;

    height: 1px;

    background: #a98be2;

    margin: 35px auto 0;
}


/* ---------- Sections ---------- */

section {
    padding: 90px 0;
}

section p {
    color: #dfcff8;
}

.section-title {
    text-align: center;

    margin-bottom: 50px;
}

.section-title h2 {
    font-size: clamp(30px, 5vw, 48px);

    font-weight: 400;

    margin-bottom: 15px;

    color: #faf8ff;
}

.section-title p {
    max-width: 700px;

    margin: auto;

    color: #dfcff8;

    font-size: 17px;
}

.content {
    max-width: 850px;

    margin: 0 auto;
}

.content p {
    color: #dfcff8;

    font-size: 17px;

    margin-bottom: 24px;
}


/* ---------- Highlight ---------- */

.highlight {
    border-left: 2px solid #a98be2;

    padding: 25px 30px;

    margin: 45px 0;

    background: rgba(156, 123, 221, 0.07);

    border-radius: 0 12px 12px 0;
}

.highlight p {
    font-size: 20px;

    font-style: italic;

    color: #eee9f7;

    margin: 0;
}


/* ---------- Vision ---------- */

.vision {
    background: rgba(255, 255, 255, 0.018);

    border-top: 1px solid rgba(255,255,255,.06);

    border-bottom: 1px solid rgba(255,255,255,.06);
}


/* ---------- Cards ---------- */

.cards {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 25px;
}

.card {
    padding: 35px 28px;

    border: 1px solid rgba(190, 166, 239, 0.18);

    border-radius: 16px;

    background: rgba(255,255,255,0.03);

    transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease;
}

.card:hover {
    transform: translateY(-6px);

    border-color: rgba(190, 166, 239, 0.45);

    background: rgba(255,255,255,0.05);
}

.card-number {
    font-size: 14px;

    letter-spacing: 2px;

    color: #b79be5;

    margin-bottom: 18px;
}

.card h3 {
    font-size: 23px;

    font-weight: 400;

    color: #faf8ff;

    margin-bottom: 15px;
}

.card p {
    color: #dfcff8;

    font-size: 17px;
}


/* ---------- Method ---------- */

.method-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 20px;

    margin-top: 45px;
}

.method-item {
    text-align: center;

    padding: 35px 20px;
}

.method-symbol {
    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border: 1px solid rgba(200,180,240,.35);

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    color: #d0baf3;
}

.method-item h3 {
    font-size: 21px;

    font-weight: 400;

    color: #faf8ff;

    margin-bottom: 10px;
}

.method-item p {
    color: #dfcff8;

    font-size: 15px;
}


/* ---------- Mission ---------- */

.mission {
    text-align: center;
}

.mission-content {
    max-width: 800px;

    margin: auto;
}

.mission-content p {
    color: #ded7e9;

    font-size: 18px;
}


/* ---------- Offer ---------- */

.offer-list {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 18px;

    margin-top: 40px;
}

.offer-item {
    padding: 22px 25px;

    border: 1px solid rgba(190, 166, 239, 0.18);

    border-radius: 12px;

    background: rgba(255,255,255,.025);

    color: #e1dbea;

    font-size: 17px;

    transition:
        background .3s ease,
        border-color .3s ease,
        transform .3s ease;
}

.offer-item:hover {
    background: rgba(255,255,255,.045);

    border-color: rgba(190, 166, 239, 0.35);

    transform: translateY(-3px);
}

.offer-item::before {
    content: "✦";

    color: #b79be5;

    margin-right: 12px;
}


/* ---------- Final Quote ---------- */

.final {
    padding: 130px 20px;

    text-align: center;
}

.final-content {
    max-width: 850px;

    margin: auto;
}

.final p {
    font-size: clamp(24px, 4vw, 38px);

    line-height: 1.45;

    font-weight: 300;

    color: #f1ecf8;

    font-style: italic;
}

.final-small {
    margin-top: 25px;

    font-size: 14px !important;

    color: #aaa1b8 !important;

    font-style: normal !important;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* ---------- Responsive ---------- */

@media (max-width: 800px) {

    section {
        padding: 65px 0;
    }

    .hero {
        min-height: 65vh;

        padding: 80px 20px 60px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .method-grid {
        grid-template-columns: 1fr;

        gap: 10px;
    }

    .offer-list {
        grid-template-columns: 1fr;
    }

    .content p {
        font-size: 16px;
    }

    .highlight {
        padding: 22px;
    }

    .highlight p {
        font-size: 18px;
    }
}


@media (max-width: 480px) {

    .container {
        width: 88%;
    }

    .hero {
        padding-top: 70px;
    }

    .eyebrow {
        font-size: 11px;

        letter-spacing: 3px;
    }

    .hero h1 {
        font-size: 43px;
    }

    .hero-intro {
        font-size: 16px;
    }

    .section-title {
        margin-bottom: 35px;
    }

    .section-title h2 {
        font-size: 32px;
    }

    .card {
        padding: 28px 22px;
    }

    .final {
        padding: 90px 20px;
    }

}
</style>
