{% load i18n %}
<article class="product-card">

    <div class="product-image">

        <span class="product-category">
            {% trans "Inner World" %}
        </span>

        <img
            src="static/image/image14.jpeg"
            alt="Relationships and Compatibility"
        >

    </div>

    <div class="product-content">

        <h2>
            {% trans "Psychic Magnetism" %}
        </h2>

        <p>
            {% blocktrans %}
            Explore the invisible dimensions of your inner
            world through astrology, numerology and subtle
            energies to support personal growth and balance.
            {% endblocktrans %}
        </p>

        <a
            href="/innerWorld"
            class="product-button"
        >
            {% trans "Explore" %}
            <span>→</span>
        </a>

    </div>

</article>
