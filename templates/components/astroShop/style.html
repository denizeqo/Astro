<style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
            background: #0d0820;
            color: #faf8ff;
            line-height: 1.6;
            overflow-x: hidden;
        }


        /* =========================================
           BACKGROUND
        ========================================= */

        .stars,
        .stars::before,
        .stars::after {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .stars {
            z-index: 0;

            background-image:
                radial-gradient(
                    1px 1px at 10% 20%,
                    rgba(255,255,255,.8),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 30% 70%,
                    rgba(255,255,255,.6),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 50% 30%,
                    rgba(255,255,255,.7),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 70% 80%,
                    rgba(255,255,255,.6),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 90% 40%,
                    rgba(255,255,255,.8),
                    transparent
                ),
                radial-gradient(
                    2px 2px at 20% 90%,
                    rgba(255,255,255,.5),
                    transparent
                ),
                radial-gradient(
                    2px 2px at 80% 15%,
                    rgba(255,255,255,.5),
                    transparent
                );

            opacity: .65;
        }

        .stars::before {
            content: "";

            background-image:
                radial-gradient(
                    1px 1px at 15% 45%,
                    rgba(255,255,255,.6),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 45% 10%,
                    rgba(255,255,255,.7),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 65% 55%,
                    rgba(255,255,255,.6),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 85% 75%,
                    rgba(255,255,255,.7),
                    transparent
                );

            animation: starsMove 15s linear infinite;
        }

        @keyframes starsMove {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-30px);
            }

        }


        /* =========================================
           PAGE
        ========================================= */

        .shop-page {
            position: relative;
            z-index: 1;
        }

        .shop-container {
            width: min(1200px, 90%);
            margin: 0 auto;
        }


        /* =========================================
           HEADER
        ========================================= */

        .shop-header {
            text-align: center;
            padding: 110px 20px 60px;
        }

        .shop-eyebrow {
            color: #bda5e8;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .shop-header h1 {
            font-size: clamp(42px, 7vw, 70px);
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 25px;
        }

        .shop-header h1 span {
            color: #d1bcf7;
        }

        .shop-header p {
            max-width: 720px;
            margin: auto;
            color: #dfcff8;
            font-size: 17px;
        }

        .header-line {
            width: 80px;
            height: 1px;
            background: #a98be2;
            margin: 30px auto 0;
        }


        /* =========================================
           FILTER / SEARCH
        ========================================= */

        .shop-tools {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 55px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            width: min(400px, 100%);
        }

        .search-box input {
            width: 100%;
            height: 48px;

            padding: 0 20px;

            border-radius: 30px;

            border: 1px solid rgba(190,166,239,.2);

            background: rgba(255,255,255,.035);

            color: #fff;

            outline: none;

            font-size: 15px;

            transition: .3s;
        }

        .search-box input::placeholder {
            color: #958ba5;
        }

        .search-box input:focus {
            border-color: rgba(190,166,239,.55);
            background: rgba(255,255,255,.05);
        }


        /* =========================================
           PRODUCTS GRID
        ========================================= */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 30px;

            padding-bottom: 100px;
        }


        /* =========================================
           PRODUCT CARD
        ========================================= */

        .product-card {

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.018)
                );

            border:
                1px solid rgba(190,166,239,.17);

            border-radius: 18px;

            overflow: hidden;

            transition:
                transform .35s ease,
                border-color .35s ease,
                box-shadow .35s ease,
                background .35s ease;
        }

        .product-card:hover {

            transform: translateY(-8px);

            border-color:
                rgba(190,166,239,.45);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.065),
                    rgba(255,255,255,.025)
                );

            box-shadow:
                0 15px 50px rgba(0,0,0,.25);
        }


        /* =========================================
           IMAGE
        ========================================= */

        .product-image {
            position: relative;
            width: 100%;
            height: 260px;
            overflow: hidden;
        }

        .product-image img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform .5s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }


        /* Image overlay */

        .product-image::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    transparent 55%,
                    rgba(13,8,32,.65)
                );

            pointer-events: none;
        }


        /* =========================================
           CATEGORY
        ========================================= */

        .product-category {

            position: absolute;

            top: 15px;
            left: 15px;

            z-index: 2;

            padding: 6px 13px;

            border-radius: 20px;

            background:
                rgba(13,8,32,.75);

            border:
                1px solid rgba(255,255,255,.15);

            backdrop-filter: blur(8px);

            color: #d5c5ef;

            font-size: 11px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }


        /* =========================================
           CARD CONTENT
        ========================================= */

        .product-content {

            display: flex;
            flex-direction: column;

            flex: 1;

            padding: 28px 26px 25px;
        }

        .product-content h2 {

            font-size: 22px;

            font-weight: 400;

            line-height: 1.3;

            color: #faf8ff;

            margin-bottom: 15px;
        }

        .product-content p {

            font-size: 15px;

            line-height: 1.7;

            color: #dfcff8;

            margin-bottom: 25px;

            flex: 1;
        }


        /* =========================================
           BUTTON
        ========================================= */

        .product-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            min-height: 45px;

            padding: 10px 20px;

            border-radius: 25px;

            border:
                1px solid rgba(190,166,239,.35);

            background:
                rgba(156,123,221,.08);

            color: #e9e1f5;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: .3px;

            transition:
                background .3s ease,
                border-color .3s ease,
                transform .3s ease;
        }

        .product-button:hover {

            background:
                rgba(156,123,221,.2);

            border-color:
                rgba(190,166,239,.65);

            transform: translateY(-2px);
        }

        .product-button span {

            margin-left: 8px;

            transition:
                transform .3s ease;
        }

        .product-button:hover span {
            transform: translateX(4px);
        }


        /* =========================================
           NO RESULTS
        ========================================= */

        .no-results {

            display: none;

            text-align: center;

            padding: 60px 20px;

            color: #aaa0b8;

            font-size: 16px;
        }


        /* =========================================
           FOOTER AREA
        ========================================= */

        .shop-bottom {

            text-align: center;

            padding: 50px 20px 100px;

            border-top:
                1px solid rgba(255,255,255,.05);
        }

        .shop-bottom p {

            max-width: 650px;

            margin: auto;

            color: #dfcff8;

            font-size: 15px;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {

            .products-grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 25px;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .shop-container {
                width: 90%;
            }

            .shop-header {

                padding:
                    80px 15px 45px;
            }

            .shop-eyebrow {

                font-size: 11px;

                letter-spacing: 3px;
            }

            .shop-header h1 {

                font-size: 42px;
            }

            .shop-header p {

                font-size: 15px;
            }

            .shop-tools {

                margin-bottom: 35px;
            }

            .search-box {
                width: 100%;
            }

            .products-grid {

                grid-template-columns: 1fr;

                gap: 25px;

                padding-bottom: 70px;
            }

            .product-image {

                height: 240px;
            }

            .product-content {

                padding:
                    25px 22px 22px;
            }

            .product-content h2 {

                font-size: 21px;
            }

            .product-content p {

                font-size: 15px;
            }

        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 400px) {

            .shop-header h1 {
                font-size: 36px;
            }

            .product-image {
                height: 220px;
            }

        }

    </style>
