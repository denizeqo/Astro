<h1 class="tableTitle" style="margin-top: 50px; margin-bottom: 50px;">Aspects in real time</h1>

{% for i in aspects %}
<div class="glassBg widget" style="font-size: 1.1rem; color: #ede1ff; padding-bottom: unset; padding-left: 20px; padding-right: 20px; position: relative; padding-top: 30px;">

    <p  style="font-family: 'Poppins', sans-serif; text-align: center;">The <span style="color: {{i.activeColor}}; font-family: 'Poppins', sans-serif;">{{i.active}}</span> forms a {{i.type}} with <span style="color: {{i.passiveColor}}; font-family: 'Poppins', sans-serif;">{{i.passive}}</span> with an orb {{i.orb}}, and the aspect is {{i.movement}} </p>

</div>
{% endfor %}
