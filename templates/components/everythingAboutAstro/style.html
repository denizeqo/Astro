<style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
        font-family:Poppins,Arial,Helvetica,sans-serif;
        background:#0d0820;color:#ffffff;line-height:1.75;overflow-x:hidden
    }
    .stars,.stars:before,.stars:after{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
    .stars{
        z-index:0;opacity:.55;
        background-image:
        radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.8),transparent),
        radial-gradient(1px 1px at 30% 70%,rgba(255,255,255,.6),transparent),
        radial-gradient(1px 1px at 50% 30%,rgba(255,255,255,.7),transparent),
        radial-gradient(1px 1px at 70% 80%,rgba(255,255,255,.6),transparent),
        radial-gradient(1px 1px at 90% 40%,rgba(255,255,255,.8),transparent),
        radial-gradient(2px 2px at 20% 90%,rgba(255,255,255,.5),transparent),
        radial-gradient(2px 2px at 80% 15%,rgba(255,255,255,.5),transparent)
    }
    .stars:before{
        content:"";
        background-image:
        radial-gradient(1px 1px at 15% 45%,rgba(255,255,255,.6),transparent),
        radial-gradient(1px 1px at 45% 10%,rgba(255,255,255,.7),transparent),
        radial-gradient(1px 1px at 65% 55%,rgba(255,255,255,.6),transparent),
        radial-gradient(1px 1px at 85% 75%,rgba(255,255,255,.7),transparent);
        animation:starsMove 15s linear infinite
    }
    @keyframes starsMove{from{transform:translateY(0)}to{transform:translateY(-30px)}}

    .page{position:relative;z-index:1}
    .container{width:min(1180px,90%);margin:auto}
    .hero{text-align:center;padding:115px 20px 80px}
    .eyebrow{
        text-transform:uppercase;letter-spacing:5px;font-size:12px;color:#c7b5e8;margin-bottom:18px
    }
    h1{font-size:clamp(44px,7vw,78px);line-height:1.05;font-weight:400;margin-bottom:25px}
    h1 span,.accent{color:#d6c3fa}
    .hero p{max-width:820px;margin:auto;color:#ded7e9;font-size:18px}
    .line{width:80px;height:1px;background:#a98be2;margin:32px auto 0}
    .nav2{
        position:sticky;
        top:0;
        z-index:20;
        background:rgba(13,8,32,.86);
        backdrop-filter:blur(14px);
        border-bottom:1px solid rgba(255,255,255,.07);
    }
    .nav-inner{
        width:min(1180px,94%);
        margin:auto;
        display:flex;
        justify-content: center;
        gap:10px;
        overflow-x:auto;
        padding:12px 0
    }
    .nav2 a{
        flex:0 0 auto;color:#c9c0d8;text-decoration:none;font-size:12px;
        padding:8px 13px;border:1px solid rgba(190,166,239,.14);border-radius:20px
    }
    .nav2 a:hover{color:#fff;border-color:rgba(190,166,239,.45)}
    section{padding:82px 0}
    .section-head{text-align:center;max-width:850px;margin:0 auto 45px}
    .section-head h2{font-size:clamp(31px,5vw,48px);font-weight:400;line-height:1.2;margin-bottom:14px}
    .section-head p{color:#c9c1d4;font-size:20px}
    .prose{max-width:900px;margin:auto}
    .prose p{color:#ffffff;margin-bottom:20px; font-family:Poppins,Arial,Helvetica,sans-serif;}
    .quote{
        margin:35px 0;padding:25px 28px;border-left:2px solid #a98be2;
        background:rgba(156,123,221,.07);border-radius:0 14px 14px 0;color:#eee9f7;font-style:italic;font-size:20px
    }
    .feature{
        display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center;margin-bottom:45px
    }
    .feature.reverse .feature-img{order:2}
    .feature-img img{width:100%;height:360px;object-fit:cover;border-radius:18px;border:1px solid rgba(190,166,239,.18)}
    .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .card{
        padding:28px 24px;background:rgba(255,255,255,.03);
        border:1px solid rgba(190,166,239,.17);border-radius:16px;
        transition:.3s
    }
    .card:hover{transform:translateY(-5px);border-color:rgba(190,166,239,.42);background:rgba(255,255,255,.045)}
    .card .symbol{font-size:28px;color:#d0baf3;margin-bottom:12px}
    .card h3{font-size:21px;font-weight:400;color:#faf8ff;margin-bottom:10px;line-height:1.3}
    .card p{font-size:17px;color:#ffffff}
    .card strong{color:#e9e1f5;font-weight:500}
    .dark-band{background:rgba(255,255,255,.018);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06)}
    .image-wide{margin:35px auto;max-width:1000px}
    .image-wide img{width:100%;border-radius:18px;border:1px solid rgba(190,166,239,.18)}
    .tag-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:25px 0 40px}
    .tag{padding:9px 15px;border:1px solid rgba(190,166,239,.18);border-radius:22px;color:#d4cbe0;background:rgba(255,255,255,.025);font-size:13px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .color-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .color-item{padding:15px 17px;border:1px solid rgba(190,166,239,.14);border-radius:12px;background:rgba(255,255,255,.025)}
    .color-item b{display:block;color:#f0eafa;margin-bottom:3px}
    .color-item span{color:#ffffff;font-size:14px}
    .footer{text-align:center;padding:90px 20px 110px}
    .footer .big-quote{font-size:clamp(25px,4vw,40px);font-style:italic;color:#f1ecf8;line-height:1.45}
    .small{font-size:13px;color:#aaa1b8;margin-top:22px}
    @media(max-width:900px){
        .card-grid{grid-template-columns:repeat(2,1fr)}
        .feature{grid-template-columns:1fr}
        .feature.reverse .feature-img{order:0}
        .two-col{grid-template-columns:1fr}
    }
    @media(max-width:600px){
        .container{width:90%}.hero{padding:85px 18px 60px}
        .hero p{font-size:16px}.eyebrow{letter-spacing:3px}
        section{padding:62px 0}.card-grid,.color-grid{grid-template-columns:1fr}
        .card{padding:24px 20px}.feature-img img{height:250px}
        .prose p{font-size:15px}.quote{padding:20px}
        nav a{font-size:11px}
    }
</style>
