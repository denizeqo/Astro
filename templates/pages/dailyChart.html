{% extends 'index.html' %}



{% block main %}

    <br><br><br>

    {% include 'components/chart/form.html' %}

    {% include 'components/chart/chart.html' %}

    {% include 'components/chart/chartData_V1.html' %}

{% load static %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="{% static 'js/chart.js' %}"></script>


<script>

    document.getElementById("chartForm").addEventListener("submit",function(e){
        e.preventDefault(); // Stop form from reloading page
        let formData = new FormData(this);

       drawEmptyChart(document.getElementById('Chart'))
       emptyTable(document.getElementById('Talisman'))

       console.log(formData.values())
        fetch("", {   // <-- your backend route
            method: "POST",
            body: formData
        })
        .then(response => response.json())  // or .json()
        .then(data =>  {
            
            dynamicChart(data['asc']);
            dynamicAscMcIcDsc(data['fourAngles']);
            addPlanetSymbols(data['planets'])
            addStarsSymbol(data['stars']);
            addUserData(data['userData'], document.getElementById('UserData'), document.getElementById('Talisman'));


        })
        .catch(error => console.log("Error:", error));
    });

</script>


{% endblock %}
