{% extends 'index.html' %}



{% block main %}

    {% include 'components/home/landingPage.html' %}
    {% include 'components/home/item.html' %}






<style>
.info-section {
    display: flex;
    align-items: center;
    gap: 50px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 20px;
}

.info-image,
.info-content {
    flex: 1;
    color: white;
}

.info-image img {
    width: 100%;
    height: 350px;
    object-fit: fill;
    border-radius: 12px;
    display: block;
}

.info-content h2 {
    font-size: 32px;
    margin-bottom: 20px;
}

.info-content p {
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 30px;
    font-family: 'Poppins', sans-serif;
}

.info-button {
    display: inline-block;
    padding: 12px 25px;
    background: #333;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    transition: 0.2s;
}

.info-button:hover {
    opacity: 0.85;
}

/* Mobile */
@media (max-width: 768px) {
    .info-section {
        flex-direction: column;
        gap: 30px;
        padding: 40px 20px;
    }

    .info-image,
    .info-content {
        width: 100%;
    }

    .info-image img {
        height: 250px;
    }

    .info-content h2 {
        font-size: 26px;
    }
}
</style>

{% endblock %}
