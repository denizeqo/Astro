{% extends 'index.html' %}



{% block main %}

    {% include 'components/home/landingPage.html' %}

    {% include 'components/home/form.html' %}

    {% include 'components/home/chart.html' %}

    {% include 'components/home/table.html' %}





{% load static %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="{% static 'js/chart.js' %}"></script>

<script>
    document.getElementById("chartForm").addEventListener("submit", function(e){
        e.preventDefault(); // Stop form from reloading page
        let formData = new FormData(this);

       drawEmptyChart(document.getElementById('Chart'))
       emptyTable(document.getElementById('StarTbody'))
       emptyTable(document.getElementById('PlanetTbody'))
       emptyTable(document.getElementById('AscTbody'))
       emptyTable(document.getElementById('Talisman'))

        fetch("", {   // <-- your backend route
            method: "POST",
            body: formData
        })
        .then(response => response.json())  // or .json()
        .then(data => {
            //document.getElementById("result").innerText = data;
            //console.log(data['data'])
            //addPlanetSymbols(data['data'])
            dynamicChart(data['fourAngles'][0]['position']);
            dynamicAscMcIcDsc(data['fourAngles']);
            addPlanetSymbols(data['planets']);
            //tableData(data['stars'], document.getElementById('starsTable'), document.getElementById('ChartTable2'));
            planetTable(data['planets'], document.getElementById('PlanetTbody'), document.getElementById('PlanetTable'));
            addStarsSymbol(data['stars']);
            starTable(data['stars'], document.getElementById('StarTbody'), document.getElementById('StarTable'));
            starTable(data['fourAngles'], document.getElementById('AscTbody'), document.getElementById('AscTable'));

            addUserData(data['userData'], document.getElementById('UserData'), document.getElementById('Talisman'))

            document.getElementById("DownloadPDF").addEventListener("click", () => {
                downloadPDF(data['userData']);
            });

            //console.log(data['test'])
            console.log(data['test'])
     
            })
        .catch(error => console.log("Error:", error));
    });

</script>

{% endblock %}
