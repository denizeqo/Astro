{% extends 'index.html' %}


{% block main %}
<section class="translation__container">
    <h1 class="title">Translation</h1>
    <form id="translateForm" action="" method="post" class="translation__form glassBg chartForm">
        {% csrf_token %}
        <div class="row__group__tra">
            <div class="formInput">
                <h2>Source Language</h2>
                <select name="sourceLang" id="" class="glassBg">
                    <option value="en">English</option>
                    <option value="it">Italian</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="sq">Albanian</option>
                </select>
            </div>
            <div class="formInput">
                <h2>Source Language</h2>
                <select name="targetLang" id="" class="glassBg">
                    <option value="en">English</option>
                    <option value="it">Italian</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="sq">Albanian</option>
                </select>
            </div>
        </div>
        <h2>Text</h1>
        <textarea class="glassBg" name="text" id=""></textarea>
        <input type="submit" class="primarButton">
    </form>
</section>


<script>
document.getElementById("translateForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const formData = new FormData(this);

    const response = fetch("/translation", {
        method: "POST",
        body: formData
    })
    .then(res => res.blob())    
    .then(fileBlob => {
            // optional: auto-download returned file (PDF/DOCX/etc.)
            const url = URL.createObjectURL(fileBlob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "report.docx";
            a.click();
            URL.revokeObjectURL(url);
        });

    //const data = await response.json();

    //console.log(data);

    //alert(data.translated_text);
});
</script>

{% endblock %}
